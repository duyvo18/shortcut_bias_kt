# LEGACY v0.1 configuration: it does not implement v0.2 IAP train label-edit
# or v0.2 all-skill/hierarchy-aware LGT. Do not use it for the approved v0.2 study.
# Three-seed NIPS configuration retained only until v0.2 configs are implemented.
phase: screen
output_dir: outputs

data:
  - name: nips_task34
    raw_path: datasets/dataset Eedi NeurIPS 2020/data_extracted/data/train_data/train_task_3_4.csv
    metadata_dir: datasets/dataset Eedi NeurIPS 2020/data_extracted/data/metadata
    task_name: task_3_4
    min_seq_len: 3
    maxlen: 200
    kfold: 5

thresholds:
  item_min_support: 30
  local_min_support: 3
  remote_min_support: 5
  prior_low_quantile: 0.20
  prior_high_quantile: 0.80
  profile_low_max: 0.35
  profile_high_min: 0.65
  min_pairs_per_stratum: 50
  max_probe_fraction: 0.25
  bootstrap_replicates: 1000
  max_targets: null

train:
  models: [dkt, saint, akt]
  seeds: [42, 3407, 2024]
  fold: 0
  batch_size: 64
  epochs: 200
  learning_rate: 0.001
  device: cuda
  cpu_threads: 20
  cpu_interop_threads: 2
  emb_size: 128
  dropout: 0.2
