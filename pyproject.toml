[project]
name = "shortcut-bias-prelim-test"
version = "0.1.0"
description = "Pilot screening of shortcut-candidate susceptibility in knowledge tracing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pykt-toolkit==0.0.38",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
shortcut-pilot = "shortcut_bias_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
